name: Tag
on:
  workflow_run:
    # zizmor: ignore[dangerous-triggers] Only successful pushes from this repository can tag releases.
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  tag:
    if: >-
      github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      contents: write # Creates release tags for the tested commit.
    steps:
      - uses: actions/checkout@v7.0.1 # zizmor: ignore[artipacked] Release tags use the checkout credential.
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: true
      - uses: gitcalver/sh@v20261007.1
        with:
          prefix: "v0."
          remote: origin
          tag: "true"
    name: tag
