name: CI
on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Same-repository branches run on push. Keep pull_request coverage for forks,
  # whose pushes cannot run this repository's workflow.
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - run: make actions-lock-install
        env:
          GH_TOKEN: ${{ github.token }}
      - run: make lint
    name: lint

  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        go-version: ["1.25", "1.26"]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ matrix.go-version }}
      - run: make test
        env:
          GOTOOLCHAIN: local
    name: test (${{ matrix.go-version }})

  conformance:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v7.0.1
        with:
          repository: gitcalver/sh
          ref: 857287da052d1437703ead1f7d2adc76a95451ba
          path: conformance-sh
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - run: make test-conformance CONFORMANCE_DIR=conformance-sh
    name: conformance
